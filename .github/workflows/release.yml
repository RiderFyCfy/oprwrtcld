name: Build and Release OpenWrt Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            upx: true
          - goos: linux
            goarch: mipsle
            gomips: softfloat
            suffix: linux-mipsle-softfloat
            upx: true
          - goos: linux
            goarch: mips
            gomips: softfloat
            suffix: linux-mips-softfloat
            upx: true
          - goos: linux
            goarch: arm
            goarm: '7'
            suffix: linux-armv7
            upx: true
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            upx: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Cross-Compile Binary (${{ matrix.suffix }})
        working-directory: openwrt-cloud-manager
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go mod tidy
          go build -trimpath -ldflags="-s -w" -o ../dist/cloud_manager-${{ matrix.suffix }} .

      - name: Compress with UPX
        if: matrix.upx
        run: |
          upx --best --lzma dist/cloud_manager-${{ matrix.suffix }} || upx -9 dist/cloud_manager-${{ matrix.suffix }} || true
          ls -lh dist/cloud_manager-${{ matrix.suffix }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud_manager-${{ matrix.suffix }}
          path: dist/cloud_manager-${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: OpenWrt Cloud Manager (${{ github.ref_type == 'tag' && github.ref_name || 'Latest Build' }})
          files: artifacts/cloud_manager-*
          prerelease: false
          make_latest: true
