<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenWrt Cloud Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <style>
    .pulse-dot {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30 px-6 py-4">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-lg">
          Ω
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white">OpenWrt Cloud Manager</h1>
          <p class="text-xs text-slate-400">Controller DDNS: <span class="font-mono text-blue-400">ws://riderok.mooo.com:8080</span></p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <div class="bg-slate-800/80 px-4 py-2 rounded-lg border border-slate-700/60 flex items-center space-x-2 text-sm">
          <span class="text-slate-400">Active Devices:</span>
          <span id="activeCount" class="font-semibold text-emerald-400">0</span>
        </div>
        <button onclick="copySetupCommand()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2 shadow-lg shadow-blue-600/20">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
          <span id="copyBtnText">Copy Setup One-Liner</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full">
    <div id="deviceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Device cards injected dynamically -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-20">
      <div class="inline-flex p-4 rounded-full bg-slate-900 border border-slate-800 text-slate-500 mb-4">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </div>
      <h3 class="text-lg font-medium text-slate-300">No Routers Connected</h3>
      <p class="text-sm text-slate-500 max-w-md mx-auto mt-2">
        Run the setup one-liner on your OpenWrt router to connect it to this dashboard.
      </p>
    </div>
  </main>

  <!-- Terminal Modal -->
  <div id="termModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-4xl h-[600px] flex flex-col shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800 bg-slate-950">
        <div class="flex items-center space-x-2">
          <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
          <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
          <div class="w-3 h-3 rounded-full bg-emerald-500/80"></div>
          <span id="termTitle" class="text-xs font-mono text-slate-400 ml-2">Console Session</span>
        </div>
        <button onclick="closeTerminal()" class="text-slate-400 hover:text-white text-sm font-semibold px-2 py-1">✕</button>
      </div>
      <div id="termContainer" class="flex-1 bg-black p-2"></div>
    </div>
  </div>

  <script>
    let activeTerm = null;
    let termSocket = null;
    let fitAddon = null;

    function formatBytes(kb) {
      if (!kb || kb <= 0) return '0 MB';
      return (kb / 1024).toFixed(0) + ' MB';
    }

    function formatUptime(sec) {
      if (!sec) return '0m';
      const days = Math.floor(sec / 86400);
      const hours = Math.floor((sec % 86400) / 3600);
      const mins = Math.floor((sec % 3600) / 60);
      if (days > 0) return `${days}d ${hours}h`;
      if (hours > 0) return `${hours}h ${mins}m`;
      return `${mins}m`;
    }

    function renderStatusBadge(status) {
      if (status === 'online') {
        return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Online
        </span>`;
      }
      if (status === 'delayed') {
        return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
          <span class="w-2 h-2 rounded-full bg-amber-500 pulse-dot"></span> Waiting Heartbeat
        </span>`;
      }
      return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20">
        <span class="w-2 h-2 rounded-full bg-rose-500"></span> Offline
      </span>`;
    }

    async function loadDevices() {
      try {
        const res = await fetch('/api/devices');
        const devices = await res.json();
        const grid = document.getElementById('deviceGrid');
        const emptyState = document.getElementById('emptyState');
        const countSpan = document.getElementById('activeCount');

        let onlineCount = devices.filter(d => d.status !== 'offline').length;
        countSpan.textContent = `${onlineCount} / ${devices.length}`;

        if (devices.length === 0) {
          grid.innerHTML = '';
          emptyState.classList.remove('hidden');
          return;
        }
        emptyState.classList.add('hidden');

        grid.innerHTML = devices.map(d => `
          <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-5 hover:border-slate-700/80 transition shadow-lg flex flex-col justify-between">
            <div>
              <div class="flex items-start justify-between mb-3">
                <div>
                  <h2 class="text-base font-semibold text-white">${d.hostname}</h2>
                  <p class="text-xs font-mono text-slate-400">${d.mac} • ${d.arch}</p>
                </div>
                ${renderStatusBadge(d.status)}
              </div>

              <div class="text-xs text-slate-400 mb-4 line-clamp-1">${d.model}</div>

              <div class="grid grid-cols-2 gap-3 py-3 border-y border-slate-800/60 mb-4 text-xs">
                <div>
                  <span class="text-slate-500 block">CPU Load</span>
                  <span class="font-mono text-slate-200">${d.load_avg || '0.00'}</span>
                </div>
                <div>
                  <span class="text-slate-500 block">RAM Free</span>
                  <span class="font-mono text-slate-200">${formatBytes(d.mem_free_kb)} / ${formatBytes(d.mem_total_kb)}</span>
                </div>
                <div>
                  <span class="text-slate-500 block">Uptime</span>
                  <span class="font-mono text-slate-200">${formatUptime(d.uptime_sec)}</span>
                </div>
                <div>
                  <span class="text-slate-500 block">Remote IP</span>
                  <span class="font-mono text-slate-200">${d.remote_ip || 'N/A'}</span>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mt-2">
              <a href="/proxy/${d.device_id}/cgi-bin/luci/admin" target="_blank"
                 class="w-full text-center py-2 px-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium transition flex items-center justify-center space-x-1">
                <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                Open LuCI
              </a>
              <button onclick="openTerminal('${d.device_id}', '${d.hostname}')"
                      class="w-full py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium transition flex items-center justify-center space-x-1 border border-slate-700">
                <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                Web Console
              </button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error fetching devices:', err);
      }
    }

    function copySetupCommand() {
      const cmd = `sh -c "$(wget -qO- https://raw.githubusercontent.com/RiderFyCfy/oprwrtcld/main/setup.sh)"`;
      navigator.clipboard.writeText(cmd);
      const text = document.getElementById('copyBtnText');
      text.textContent = 'Copied to Clipboard!';
      setTimeout(() => text.textContent = 'Copy Setup One-Liner', 2000);
    }

    function openTerminal(deviceId, hostname) {
      document.getElementById('termTitle').textContent = `Terminal Session - ${hostname} (${deviceId})`;
      document.getElementById('termModal').classList.remove('hidden');

      const container = document.getElementById('termContainer');
      container.innerHTML = '';

      activeTerm = new Terminal({
        cursorBlink: true,
        fontSize: 13,
        fontFamily: 'Menlo, Monaco, "Courier New", monospace',
        theme: {
          background: '#020617',
          foreground: '#f8fafc',
          cursor: '#38bdf8'
        }
      });
      fitAddon = new FitAddon.FitAddon();
      activeTerm.loadAddon(fitAddon);
      activeTerm.open(container);
      fitAddon.fit();

      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      termSocket = new WebSocket(`${protocol}//${location.host}/ws/terminal/${deviceId}`);
      termSocket.binaryType = 'arraybuffer';

      termSocket.onopen = () => {
        activeTerm.write('\r\n\x1b[32m[+] Connected to router console session\x1b[0m\r\n\r\n');
      };

      termSocket.onmessage = (ev) => {
        if (typeof ev.data === 'string') {
          activeTerm.write(ev.data);
        } else {
          activeTerm.write(new Uint8Array(ev.data));
        }
      };

      termSocket.onclose = () => {
        activeTerm.write('\r\n\x1b[31m[-] Console session closed\x1b[0m\r\n');
      };

      activeTerm.onData((data) => {
        if (termSocket && termSocket.readyState === WebSocket.OPEN) {
          termSocket.send(data);
        }
      });
    }

    function closeTerminal() {
      if (termSocket) {
        termSocket.close();
        termSocket = null;
      }
      if (activeTerm) {
        activeTerm.dispose();
        activeTerm = null;
      }
      document.getElementById('termModal').classList.add('hidden');
    }

    loadDevices();
    setInterval(loadDevices, 4000);
  </script>
</body>
</html>
